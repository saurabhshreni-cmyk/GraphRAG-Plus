[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-plus"
version = "0.1.0"
description = "GraphRAG++: graph-aware RAG backend with hybrid retrieval, trust modeling, calibration, contradiction handling, and graph versioning."
authors = [{ name = "Saurabh Dwadash Shreni" }]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "networkx>=3.2.1",
  "numpy>=1.26.4",
  "scikit-learn>=1.4.2",
  "rank-bm25>=0.2.2",
  "python-dateutil>=2.9.0.post0",
  "pypdf>=4.2.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "prometheus-client>=0.20.0",
  # Required by the FastAPI app itself: the /ingest/file endpoint uses
  # UploadFile/Form, which FastAPI refuses to register without python-multipart.
  # (Previously only present transitively in the dev venv — undeclared.)
  "python-multipart>=0.0.9",
  # The /ingest/file endpoint parses .docx uploads via python-docx (imported
  # lazily). Declared so the advertised upload feature works out of the box.
  "python-docx>=1.1.0",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.1.18",
]
gnn = [
  "torch>=2.2.2",
  "torch-geometric>=2.5.3",
]
embeddings = [
  "sentence-transformers>=2.7.0",
  "faiss-cpu>=1.8.0",
]
extras = [
  "neo4j>=5.20.0",
  "chromadb>=0.5.0",
  "spacy>=3.7.5",
]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  # Pin the lint/format/type tools EXACTLY. These gate CI, and their default
  # rule sets / formatting change between releases — an unpinned `>=` silently
  # turned CI red when a new ruff release enabled PLC0415/PLW0603. Bump these
  # deliberately, never implicitly.
  "ruff==0.15.12",
  "black==26.3.1",
  "mypy==1.20.2",
]

[tool.setuptools]
# The repo root *is* the `graphrag_plus` package: pyproject.toml lives next to
# `__init__.py` and `app/`. Map the import name onto "." and enumerate packages
# explicitly so editable installs work without PYTHONPATH gymnastics.
package-dir = {"graphrag_plus" = "."}
packages = [
  "graphrag_plus",
  "graphrag_plus.app",
  "graphrag_plus.app.active_learning",
  "graphrag_plus.app.analyst",
  "graphrag_plus.app.api",
  "graphrag_plus.app.calibration",
  "graphrag_plus.app.config",
  "graphrag_plus.app.contradiction",
  "graphrag_plus.app.evaluation",
  "graphrag_plus.app.extraction",
  "graphrag_plus.app.failure",
  "graphrag_plus.app.generation",
  "graphrag_plus.app.gnn",
  "graphrag_plus.app.graph",
  "graphrag_plus.app.graph.versioning",
  "graphrag_plus.app.ingestion",
  "graphrag_plus.app.planning",
  "graphrag_plus.app.retrieval",
  "graphrag_plus.app.schemas",
  "graphrag_plus.app.scoring",
  "graphrag_plus.app.trust",
  "graphrag_plus.app.utils",
]

[tool.pytest.ini_options]
testpaths = ["graphrag_plus/app/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "unit: fast unit tests",
  "integration: integration tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".tmp", ".cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "PL", "RUF"]
ignore = [
  "E501",   # line length handled by black
  "PLR0913",
  "PLR0912",
  "PLR0915",
  "PLR0911",  # too-many-return-statements — complexity heuristic, like the others above
  "PLR2004",
  "B008",
  "UP042",   # str+Enum → StrEnum migration changes str() semantics; not worth the risk
  # Lazy, in-function imports are a deliberate architectural pattern here: heavy
  # / optional dependencies (sentence-transformers, faiss, spacy, neo4j, ollama,
  # torch) are imported inside the functions that use them so the app imports and
  # degrades gracefully when they're absent (e.g. the Vercel/serverless bundle).
  # Hoisting them to module scope would break optional-dependency handling.
  "PLC0415",  # `import` should be at top-level of file
  "PLW0603",  # using the `global` statement (module-level singletons, by design)
]

[tool.ruff.lint.per-file-ignores]
"graphrag_plus/app/tests/*" = ["PLR2004", "S101"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.mypy]
# 3.12: the dev venv and the container image both run 3.12, and current numpy
# stubs use PEP 695 `type` statements that mypy only accepts when targeting
# 3.12+. The runtime itself stays 3.11-compatible (see ruff target-version).
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
exclude = ["graphrag_plus/app/tests", ".tmp", ".cache"]

[[tool.mypy.overrides]]
module = [
  "networkx.*",
  "rank_bm25.*",
  "sklearn.*",
  "torch.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["graphrag_plus/app"]
omit = ["graphrag_plus/app/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
